name: CI
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
      && format('PR #{0} {1}', github.event.inputs.pr_number, github.event.inputs.checkout_sha)
      || github.event.pull_request.title
      || github.ref_name
  }}

on:
  push:
    branches: [ feature/ror-update-8.2.0 ]
  pull_request:
    branches: [ feature/ror-update-8.2.0, fix/loading ]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number for manually bootstrapped CI"
        required: false
        default: ""
      checkout_ref:
        description: "Branch or ref to check out"
        required: false
        default: ""
      checkout_sha:
        description: "Exact commit SHA to check out"
        required: false
        default: ""

jobs:
  # ROR Unit Tests with SWAP mode
  unit:
    strategy:
      matrix:
        platform: [ubuntu-24.04]
    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v4
      with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.checkout_sha || github.event.inputs.checkout_ref) || github.ref }}
          submodules: true
    - name: get rocksdb sha
      id: rocksdb-sha
      run: |
        ROCKSDB_SHA=$(cd deps/rocksdb && git rev-parse HEAD)
        echo "ROCKSDB_SHA is $ROCKSDB_SHA"
        echo "ROCKSDB_SHA=$ROCKSDB_SHA" >> $GITHUB_ENV
      shell: bash
    - name: cache rocksdb
      id: cache-rocksdb
      uses: actions/cache@v4
      with:
        path: deps/rocksdb
        key: ${{ runner.os }}-rocksdb-${{ env.ROCKSDB_SHA }}
    - name: install dependencies
      run: |
          sudo apt-get update
          sudo apt-get -y install libsnappy-dev zlib1g-dev libstdc++6 liburing-dev libevent-dev libunwind-dev libgoogle-glog-dev
    - name: test
      run: LD_LIBRARY_PATH=/home/runner/work/Redis-On-Rocks/Redis-On-Rocks/deps/rocksdb/_build_folly/libs/glog/lib:/home/runner/work/Redis-On-Rocks/Redis-On-Rocks/deps/rocksdb/_build_folly/libs/libevent/lib make SWAP=1 unit-test -j8

  # Memory-only mode tests (without SWAP)
  mem:
    strategy:
      matrix:
        platform: [ubuntu-24.04]
    runs-on: ${{ matrix.platform }}
    env:
      MAX_MAKE_JOBS: 4
    steps:
    - uses: actions/checkout@v4
      with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.checkout_sha || github.event.inputs.checkout_ref) || github.ref }}
          submodules: true
    - name: install dependencies
      run: |
          sudo apt-get update
          sudo apt-get -y install libsnappy-dev zlib1g-dev libstdc++6 liburing-dev libevent-dev libunwind-dev libgoogle-glog-dev
    - name: decide make jobs
      run: |
          CPU_COUNT=$(nproc)
          MAKE_JOBS=$CPU_COUNT
          if [ "$MAKE_JOBS" -gt "$MAX_MAKE_JOBS" ]; then
            MAKE_JOBS=$MAX_MAKE_JOBS
          fi
          echo "MAKE_JOBS=$MAKE_JOBS" >> "$GITHUB_ENV"
    - name: make
      run: make -j${MAKE_JOBS}
    - name: test
      run: make test -j${MAKE_JOBS}

  # Memory-only mode with Address Sanitizer
  mem-asan:
    strategy:
      matrix:
        platform: [ubuntu-24.04]
    runs-on: ${{ matrix.platform }}
    env:
      MAX_MAKE_JOBS: 4
    steps:
    - uses: actions/checkout@v4
      with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.checkout_sha || github.event.inputs.checkout_ref) || github.ref }}
          submodules: true
    - name: install dependencies
      run: |
          sudo apt-get update
          sudo apt-get -y install libsnappy-dev zlib1g-dev libstdc++6 liburing-dev libevent-dev libunwind-dev libgoogle-glog-dev
    - name: decide make jobs
      run: |
          CPU_COUNT=$(nproc)
          MAKE_JOBS=$CPU_COUNT
          if [ "$MAKE_JOBS" -gt "$MAX_MAKE_JOBS" ]; then
            MAKE_JOBS=$MAX_MAKE_JOBS
          fi
          echo "MAKE_JOBS=$MAKE_JOBS" >> "$GITHUB_ENV"
    - name: make
      run: make SANITIZER=address -j${MAKE_JOBS}
    - name: test
      run: make test-asan -j${MAKE_JOBS}

  # SWAP mode tests (with RocksDB)
  swap:
    strategy:
      matrix:
        platform: [ubuntu-24.04]
    runs-on: ${{ matrix.platform }}
    env:
      MAX_MAKE_JOBS: 2
    steps:
    - uses: actions/checkout@v4
      with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.checkout_sha || github.event.inputs.checkout_ref) || github.ref }}
          submodules: true
    - name: get rocksdb sha
      id: rocksdb-sha
      run: |
        ROCKSDB_SHA=$(cd deps/rocksdb && git rev-parse HEAD)
        echo "ROCKSDB_SHA is $ROCKSDB_SHA"
        echo "ROCKSDB_SHA=$ROCKSDB_SHA" >> $GITHUB_ENV
      shell: bash
    - name: cache rocksdb
      id: cache-rocksdb
      uses: actions/cache@v4
      with:
        path: deps/rocksdb
        key: ${{ runner.os }}-rocksdb-${{ env.ROCKSDB_SHA }}
    - name: install dependencies
      run: |
          sudo apt-get update
          sudo apt-get -y install libsnappy-dev zlib1g-dev libstdc++6 liburing-dev libevent-dev libunwind-dev libgoogle-glog-dev
    - name: decide make jobs
      run: |
          CPU_COUNT=$(nproc)
          MAKE_JOBS=$CPU_COUNT
          if [ "$MAKE_JOBS" -gt "$MAX_MAKE_JOBS" ]; then
            MAKE_JOBS=$MAX_MAKE_JOBS
          fi
          echo "MAKE_JOBS=$MAKE_JOBS" >> "$GITHUB_ENV"
    - name: make
      run: make SWAP=1 -j${MAKE_JOBS}
    - name: test
      run: LD_LIBRARY_PATH=/home/runner/work/Redis-On-Rocks/Redis-On-Rocks/deps/rocksdb/_build_folly/libs/glog/lib:/home/runner/work/Redis-On-Rocks/Redis-On-Rocks/deps/rocksdb/_build_folly/libs/libevent/lib make SWAP=1 test -j${MAKE_JOBS}

  # SWAP mode with Address Sanitizer
  swap-asan:
    strategy:
      matrix:
        platform: [ubuntu-24.04]
    runs-on: ${{ matrix.platform }}
    env:
      MAX_MAKE_JOBS: 2
    steps:
    - uses: actions/checkout@v4
      with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.checkout_sha || github.event.inputs.checkout_ref) || github.ref }}
          submodules: true
    - name: get rocksdb sha
      id: rocksdb-sha
      run: |
        ROCKSDB_SHA=$(cd deps/rocksdb && git rev-parse HEAD)
        echo "ROCKSDB_SHA is $ROCKSDB_SHA"
        echo "ROCKSDB_SHA=$ROCKSDB_SHA" >> $GITHUB_ENV
      shell: bash
    - name: cache rocksdb
      id: cache-rocksdb
      uses: actions/cache@v4
      with:
        path: deps/rocksdb
        key: ${{ runner.os }}-rocksdb-${{ env.ROCKSDB_SHA }}
    - name: install dependencies
      run: |
          sudo apt-get update
          sudo apt-get -y install libsnappy-dev zlib1g-dev libstdc++6 liburing-dev libevent-dev libunwind-dev libgoogle-glog-dev
    - name: decide make jobs
      run: |
          CPU_COUNT=$(nproc)
          MAKE_JOBS=$CPU_COUNT
          if [ "$MAKE_JOBS" -gt "$MAX_MAKE_JOBS" ]; then
            MAKE_JOBS=$MAX_MAKE_JOBS
          fi
          echo "MAKE_JOBS=$MAKE_JOBS" >> "$GITHUB_ENV"
    - name: make
      run: make SWAP=1 SANITIZER=address -j${MAKE_JOBS}
    - name: test
      run: LD_LIBRARY_PATH=/home/runner/work/Redis-On-Rocks/Redis-On-Rocks/deps/rocksdb/_build_folly/libs/glog/lib:/home/runner/work/Redis-On-Rocks/Redis-On-Rocks/deps/rocksdb/_build_folly/libs/libevent/lib make SWAP=1 test-asan -j${MAKE_JOBS}
